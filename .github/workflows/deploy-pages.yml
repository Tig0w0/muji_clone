name: Deploy React to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_BASE_URL: https://muji-clone-api.onrender.com

      - name: Stage local AI model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="build/models/onnx-community/gemma-3-270m-it-ONNX"
          HF_BASE="https://huggingface.co/onnx-community/gemma-3-270m-it-ONNX/resolve/main"
          RELEASE_BASE="https://github.com/Tig0w0/muji_clone/releases/download/ai-model-gemma3-270m-v1"

          mkdir -p "$MODEL_DIR/onnx"

          for file in \
            added_tokens.json \
            chat_template.jinja \
            config.json \
            generation_config.json \
            special_tokens_map.json \
            tokenizer.json \
            tokenizer.model \
            tokenizer_config.json
          do
            curl -L --fail --retry 3 --retry-all-errors \
              "$HF_BASE/$file" \
              -o "$MODEL_DIR/$file"
          done

          for file in model_q4.onnx model_q4f16.onnx
          do
            curl -L --fail --retry 3 --retry-all-errors \
              "$HF_BASE/onnx/$file" \
              -o "$MODEL_DIR/onnx/$file"
          done

          for file in model_q4.onnx_data model_q4f16.onnx_data
          do
            curl -L --fail --retry 3 --retry-all-errors \
              "$RELEASE_BASE/$file" \
              -o "$MODEL_DIR/onnx/$file"
          done

          du -sh build "$MODEL_DIR"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
