<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/images/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="기분 좋은 생활을 제안하는 무인양품입니다." />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>무인양품 클론</title>
  <style>
    #bootstrap-loader {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; background: #fff; color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif; text-align: center;
    }
    #bootstrap-loader .box { width: min(360px, 100%); }
    #bootstrap-loader .brand { font-size: 22px; font-weight: 700; margin-bottom: 28px; }
    #bootstrap-loader .spinner {
      width: 30px; height: 30px; margin: 0 auto 22px; border: 3px solid #e8e8e8;
      border-top-color: #7f0019; border-radius: 50%; animation: bootstrap-spin .8s linear infinite;
    }
    #bootstrap-loader .title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    #bootstrap-loader .note { font-size: 12px; line-height: 1.7; color: #777; }
    @keyframes bootstrap-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <noscript>이 사이트를 사용하려면 JavaScript를 활성화해주세요.</noscript>
  <div id="root">
    <div id="bootstrap-loader" role="status" aria-live="polite">
      <div class="box">
        <div class="brand">MUJI 無印良品</div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="title">상품 데이터를 불러오는 중입니다.</div>
        <div class="note">
          무료 백엔드가 절전 상태라면 첫 접속에 약 1분 정도 걸릴 수 있습니다.<br />
          서버가 준비되면 자동으로 쇼핑몰이 열립니다.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
